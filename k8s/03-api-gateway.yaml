apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cloudjudge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: cloudjudge-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: COORDINATOR_HTTP
              value: "http://coordinator.cloudjudge.svc.cluster.local:4001"
            - name: REDIS_HOST
              value: "redis.cloudjudge.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cloudjudge
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 4000
      targetPort: 4000
